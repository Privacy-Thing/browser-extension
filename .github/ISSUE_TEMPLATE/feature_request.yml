name: Feature request
description: Suggest a change or a new capability
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve
      description: |
        Describe the situation you are in, not the implementation you have in mind.
        A concrete case is worth more than a general principle.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like it to do
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
      description: Existing settings, other extensions, manual workarounds.

  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This affects spoofing behaviour that a page can observe
        - label: This needs to work the same on Chromium and Firefox
