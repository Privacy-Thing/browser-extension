version: 2

updates:
  # Actions are pinned to full commit SHAs, so Dependabot is the mechanism that
  # moves them. Without this entry a pinned action never gets a security fix.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-minor-days: 7
      semver-patch-days: 3
    # Routine version PRs stay within the current major. Security updates are
    # unaffected by update-types and still open for any required version.
    allow:
      - dependency-type: all
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      dev-dependencies:
        dependency-type: development
        patterns:
          - "*"
        # Playwright is excluded on purpose: every Playwright package is pinned in
        # pnpm-workspace.yaml to the version baked into the CI browser image. A
        # grouped bump would raise one package and break e2e with "Executable
        # doesn't exist". Bump it deliberately, together with the image.
        exclude-patterns:
          - "@playwright/test"
          - "playwright"
          - "playwright-core"
      production-dependencies:
        dependency-type: production
        patterns:
          - "*"
    ignore:
      # react and react-dom must resolve to the same version; pnpm-workspace.yaml
      # pins both. Ignore routine version PRs, but keep security updates eligible.
      - dependency-name: react
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: react-dom
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      # Playwright must move together with the public CI image and the workspace
      # overrides. Its routine version updates are manual; security updates remain.
      - dependency-name: "@playwright/test"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: playwright
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: playwright-core
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
    commit-message:
      prefix: "build(deps)"
      prefix-development: "build(deps-dev)"
