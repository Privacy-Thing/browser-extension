        run: |
          REPORT_PATH="build/test-results/firefox-runtime-report.json"
          if [ ! -f "${REPORT_PATH}" ]; then
            exit 0
          fi

          node - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          const fs = require("node:fs");

          const reportPath = "build/test-results/firefox-runtime-report.json";
          const report = JSON.parse(fs.readFileSync(reportPath, "utf8"));
          const tests = [];
          const phases = [];

          const visitSuite = (suite, titlePath = []) => {
            const nextTitlePath = suite.title ? [...titlePath, suite.title] : titlePath;
            for (const spec of suite.specs ?? []) {
              const specTitlePath = [...nextTitlePath, spec.title].filter(Boolean);
              const specDuration = (spec.tests ?? []).reduce((sum, test) => {
                return (
                  sum +
                  (test.results ?? []).reduce(
                    (innerSum, result) => innerSum + (result.duration ?? 0),
                    0
                  )
                );
              }, 0);
              tests.push({
                title: specTitlePath.join(" › "),
                durationMs: specDuration,
                status: (spec.tests ?? [])
                  .map((test) => {
                    const explicitStatus =
                      typeof test.status === "string" ? test.status : null;
                    if (explicitStatus) {
                      return explicitStatus;
                    }

                    const resultStatuses = (test.results ?? [])
                      .map((result) => result.status)
                      .filter((status) => typeof status === "string");
                    return resultStatuses.join(", ");
                  })
                  .filter(Boolean)
                  .join(", ")
              });

              const visitSteps = (steps, testResult) => {
                for (const step of steps ?? []) {
                  if (typeof step.title === "string" && step.title.startsWith("phase: ")) {
                    phases.push({
                      testTitle: specTitlePath.join(" › "),
                      phaseTitle: step.title.replace(/^phase:\s*/, ""),
                      durationMs: step.duration ?? 0,
                      status: testResult.status ?? "unknown"
                    });
                  }

                  visitSteps(step.steps, testResult);
                }
              };

              for (const specTest of spec.tests ?? []) {
                for (const result of specTest.results ?? []) {
                  visitSteps(result.steps, result);
                }
              }
            }
            for (const child of suite.suites ?? []) {
              visitSuite(child, nextTitlePath);
            }
          };

          for (const suite of report.suites ?? []) {
            visitSuite(suite);
          }

          tests.sort((a, b) => b.durationMs - a.durationMs);
          const top = tests.slice(0, 10);
          phases.sort((a, b) => b.durationMs - a.durationMs);
          const topPhases = phases.slice(0, 12);

          console.log("## Firefox runtime slowest tests");
          console.log("");
          console.log("| Test | Duration | Status |");
          console.log("| --- | ---: | --- |");
          for (const test of top) {
            console.log(
              `| ${test.title.replace(/\|/g, "\\|")} | ${(test.durationMs / 1000).toFixed(1)}s | ${test.status} |`
            );
          }

          if (topPhases.length > 0) {
            console.log("");
            console.log("## Firefox runtime slowest phases");
            console.log("");
            console.log("| Test | Phase | Duration | Status |");
            console.log("| --- | --- | ---: | --- |");
            for (const phase of topPhases) {
              console.log(
                `| ${phase.testTitle.replace(/\|/g, "\\|")} | ${phase.phaseTitle.replace(/\|/g, "\\|")} | ${(phase.durationMs / 1000).toFixed(1)}s | ${phase.status} |`
              );
            }
          }
          EOF

      - name: Upload Firefox runtime report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-runtime-firefox-report
          path: build/test-results/firefox-runtime-report.json
          if-no-files-found: ignore
          retention-days: 14

  api-conformance:
    timeout-minutes: 15
    needs:
      - changes
      - build-e2e-assets
    if: >-
      (needs.changes.outputs.needs_e2e_core == 'true'
      || needs.changes.outputs.needs_api_conformance == 'true')
      && needs.changes.outputs.already_validated != 'true'
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --ipc=host
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE_DIR }}
          key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-pnpm11-node24-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-${{ runner.arch }}-pnpm11-node24-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Chromium build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: e2e-build-chromium
          path: build/chrome

      - name: Download Chromium runtime marker
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: e2e-build-chromium-runtime-marker
          path: build

      - name: Download Firefox build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: e2e-build-firefox
          path: build/firefox

      - name: Run API conformance
        env:
          HOME: /root
        run: pnpm exec task test:api-conformance -- --json --html --github-summary

      - name: Write job summary
        if: always()
        run: |
          if [ -f build/api-conformance/github-summary.md ]; then
            cat build/api-conformance/github-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: api-conformance-report
          path: build/api-conformance/api-conformance-report.html
          retention-days: 30

  package-beta:
    timeout-minutes: 15
    if: >-
      always()
      && needs.changes.result == 'success'
      && github.event_name == 'push'
      && github.ref_name == 'main'
      && needs.changes.outputs.needs_package == 'true'
      && (needs.lint.result == 'success' || needs.lint.result == 'skipped')
      && (needs.typescript.result == 'success' || needs.typescript.result == 'skipped')
      && (needs.unit.result == 'success' || needs.unit.result == 'skipped')
      && (needs.build-e2e-assets.result == 'success' || needs.build-e2e-assets.result == 'skipped')
      && (needs.e2e-options-navigation.result == 'success' || needs.e2e-options-navigation.result == 'skipped')
      && (needs.e2e-options-rules.result == 'success' || needs.e2e-options-rules.result == 'skipped')
      && (needs.e2e-options-profiles.result == 'success' || needs.e2e-options-profiles.result == 'skipped')
      && (needs.e2e-popup.result == 'success' || needs.e2e-popup.result == 'skipped')
      && (needs.e2e-runtime-chromium.result == 'success' || needs.e2e-runtime-chromium.result == 'skipped')
      && (needs.e2e-state.result == 'success' || needs.e2e-state.result == 'skipped')
      && (needs.e2e-runtime-firefox.result == 'success' || needs.e2e-runtime-firefox.result == 'skipped')
      && (needs.build-assertions-chromium.result == 'success' || needs.build-assertions-chromium.result == 'skipped')
      && (needs.build-assertions-firefox.result == 'success' || needs.build-assertions-firefox.result == 'skipped')
      && (needs.api-conformance-tooling.result == 'success' || needs.api-conformance-tooling.result == 'skipped')
      && (needs.api-conformance.result == 'success' || needs.api-conformance.result == 'skipped')
    needs:
      - changes
      - lint
      - typescript
      - unit
      - build-e2e-assets
      - e2e-options-navigation
      - e2e-options-rules
      - e2e-options-profiles
      - e2e-popup
      - e2e-runtime-chromium
      - e2e-state
      - e2e-runtime-firefox
      - build-assertions-chromium
      - build-assertions-firefox
      - api-conformance-tooling
      - api-conformance
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE_DIR }}
          key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-pnpm11-node24-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-${{ runner.arch }}-pnpm11-node24-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve beta build metadata
        run: |
          BUILD_TIMESTAMP="$(date -u +%Y%m%d_%H%M%S)"
          echo "PT_BUILD_CHANNEL=beta" >> "$GITHUB_ENV"
          echo "PT_BUILD_TIMESTAMP=${BUILD_TIMESTAMP}" >> "$GITHUB_ENV"
          PT_BUILD_CHANNEL=beta PT_BUILD_TIMESTAMP="${BUILD_TIMESTAMP}" node scripts/resolve-build-metadata.mjs >> "$GITHUB_ENV"

      - name: Package beta artifacts
        env:
          PT_PACKAGE_CHROMIUM_CRX: "false"
        run: pnpm package:release

      - name: Upload beta artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.PT_ARTIFACT_VERSION_LABEL }}
          path: |
            build/artifacts/*-chromium.zip
            build/artifacts/*-firefox.zip
            build/artifacts/*-firefox.xpi
