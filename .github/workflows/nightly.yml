name: nightly

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

# A manual dispatch can land on top of the cron run, so keep one nightly workflow
# active at a time.
concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PNPM_STORE_DIR: ${{ github.workspace }}/build/pnpm-store
  PNPM_CONFIG_STORE_DIR: ${{ github.workspace }}/build/pnpm-store

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE_DIR }}
          key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-pnpm11-node24-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-${{ runner.arch }}-pnpm11-node24-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build E2E assets
        run: pnpm build:e2e-assets

      - name: Upload E2E build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-build-assets
          path: |
            build/chrome
            build/firefox
          retention-days: 1

  live-diagnostics:
    needs: build
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --ipc=host
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE_DIR }}
          key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-pnpm11-node24-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-${{ runner.arch }}-pnpm11-node24-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download E2E build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: e2e-build-assets
          path: build

      - name: Live diagnostic tests
        env:
          PT_E2E_LANE: release
        run: >-
          pnpm exec playwright test --config config/playwright.config.ts
          tests/e2e/google-maps-diagnostic.spec.ts
          tests/e2e/service-worker-blocking-live.spec.ts
