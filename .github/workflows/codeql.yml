name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Catches advisories published after a commit landed.
    - cron: "27 4 * * 1"

permissions: read-all

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze JavaScript and TypeScript
    # This workflow runs for pull requests from forks, so keep it GitHub-hosted
    # and isolated from privileged environments or repository credentials.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e12f0178983d466f2f6028f5cc7a6d786fd97f4b # v4.31.4
        with:
          languages: javascript-typescript
          queries: security-and-quality

      # No build step: CodeQL analyses the TypeScript sources directly. Building
      # the extension would only add the bundled output, which it cannot use.
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@e12f0178983d466f2f6028f5cc7a6d786fd97f4b # v4.31.4
        with:
          category: "/language:javascript-typescript"
